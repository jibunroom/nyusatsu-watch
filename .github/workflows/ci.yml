name: ci

# §11-5 watch.yml とは別に、push 時に pytest を回す。
# ネット・Gemini・SMTP を一切使わずに通ること。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q
