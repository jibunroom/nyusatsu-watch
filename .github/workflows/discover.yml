name: discover

on:
  schedule:
    # JST 月曜 06:07 / 07:07 / 08:07 の3回試行（scheduleの欠落対策）。
    # 探索は冪等なので複数回走っても結果は同じ・コミットも重複しない
    - cron: '7 21,22,23 * * 0'
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

permissions:
  contents: write   # config/sources.yml を更新してコミット（§1-4）

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: discover feeds
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.discover

      - name: commit sources.yml
        run: |
          git config user.name  "nyusatsu-watch[bot]"
          git config user.email "actions@github.com"
          git add config/sources.yml
          git diff --cached --quiet || {
            git commit -m "chore: フィード探索結果を反映"
            git push
          }
