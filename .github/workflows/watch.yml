name: watch

# GitHub の schedule は「指定時刻に1回」が信用できない（遅延・欠落の実績あり）。
# そこで20分おきに起動を試みさせ、実際に走るかは gate（src/slots.py）が判定する。
# スロットは JST 07:37〜 の morning と 17:37〜 の evening の1日2回。
# 実行済みスロットは data/last_batch.json に記録され二重実行しない。
# → 個々の起動が遅れても飛ばされても、次の起動が拾う。メールは1日2通のまま。
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:         # 手動実行（gate を通らず必ず走る）

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write   # data/ を commit & push する（§7）

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: gate（このスロットを走らせるか判定）
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "due=manual" >> "$GITHUB_OUTPUT"
          else
            # 標準ライブラリのみで動く（pip install 前）
            python3 -m src.slots >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT" || true

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.due != 'none'
        with:
          python-version: '3.12'
          cache: pip

      - if: steps.gate.outputs.due != 'none'
        run: pip install -r requirements.txt

      - name: run pipeline
        if: steps.gate.outputs.due != 'none'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          git config user.name  "nyusatsu-watch[bot]"
          git config user.email "actions@github.com"
          python -m src.main
