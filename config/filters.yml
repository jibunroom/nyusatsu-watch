# 一次フィルタ語彙（§2）
# AI を使わずここで9割落とす。判断に迷うものは「除外せず Gemini に回す」が原則。

# §2-1 候補として通す条件（OR）。タイトルまたは URL に含まれれば候補。
include:
  - 入札
  - 公告
  - 公募
  - 企画提案
  - プロポーザル
  - 見積
  - 委託
  - 業務委託
  - 指名競争
  - 一般競争
  - 随意契約
  - 調達
  - 落札
  - 開札
  - 入札結果

# §2-3 落札結果として別処理へ回す語（include より優先して判定）
result_markers:
  - 落札
  - 入札結果
  - 開札結果
  - 契約結果

# §2-2 即除外（タイトルで判定・OR）
# 「設計」は単体では入れない。exclude_cooccurrence 側で扱う。
exclude:
  - 工事
  - 建設
  - 土木
  - 舗装
  - 造成
  - 解体
  - 改修工事
  - 修繕
  - 測量
  - 地質
  - 給食
  - 清掃
  - 警備
  - 除草
  - 剪定
  - 廃棄物
  - 収集運搬
  - し尿
  - 浄化槽
  - 消防設備
  - 機械設備
  - 電気設備
  - 空調
  - エレベーター
  - 車両購入
  - 燃料
  - 医薬品
  - 検便
  - 健診
  - ワクチン

# 「システム設計」「Webデザイン」を誤除外しないための共起ルール（§2-2 注記）。
# left のいずれか AND right のいずれか が両方そろったときだけ除外する。
exclude_cooccurrence:
  - left:
      - 実施設計
      - 基本設計
      - 詳細設計
    right:
      - 建築
      - 土木
      - 橋梁
      - 道路
      - 護岸
      - 港湾
      - 河川
      - 上水道
      - 下水道
      - 造成
      - 耐震
      - 構造
      - 施設整備
      - 庁舎
      - 校舎
      - 公園

# 共起ルールの right 側が出ていても、これらの語があれば除外しない（IT 文脈の救済）。
# 取りこぼし防止を優先し、迷うものは Gemini に回す。
exclude_rescue:
  - システム
  - ソフトウェア
  - ネットワーク
  - Web
  - ホームページ
  - アプリ
  - デジタル
  - DX
  - 情報
  - データ
  - 電子
