# 監視対象機関（§1）
#
# status:
#   ok      … feed 確定。日次巡回の対象
#   todo    … 未探索。次回の discover.py が feed を探す
#   no_feed … 探索したが見つからなかった（サマリメールに列挙される）
#
# method:
#   feed    … RSS/Atom を巡回
#   scrape  … HTML スクレイピング（v1 未実装・§1-3）
#
# fail_streak … 日次巡回の連続失敗回数。3 に達すると再探索される
#
# ※このファイルは discover.py が自動更新するためコメントは保持されない。
# 機関を追加するときは name / top / method: feed / status: todo を書けばよい
# （離島市町村もこれで足せる）。top URL は実 HTTP で 200 を確認すること。

